<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a2624" />
  <meta name="description" content="شاهد قنوات تلفزيونية عربية وعالمية مباشرة ومجانًا — تجميع مفتوح من قوائم IPTV على GitHub." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src https: http: blob:; connect-src 'self' https://iptv-org.github.io http: https: blob:; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <title>قنوات التلفزيون العربية والعالمية — بث مباشر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
</head>
<body class="tv-page">
  <div class="bg-decor" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <nav class="top-nav" aria-label="التنقل الرئيسي">
    <a href="index.html" class="nav-link">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
      راديو
    </a>
    <a href="tv.html" class="nav-link active" aria-current="page">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/></svg>
      تلفزيون
    </a>
  </nav>

  <header class="hero compact">
    <div class="hero-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64" fill="none">
        <rect x="4" y="18" width="56" height="38" rx="9" fill="url(#g2)"/>
        <path d="M22 10 L32 20 L42 10" stroke="#f5c66d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M30 28 v18 M38 28 v18 M26 34 h16 M26 41 h16 M30 28 h8 v18 h-8 z" opacity=".25"/>
        <defs><linearGradient id="g2" x1="4" y1="18" x2="60" y2="56"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      </svg>
    </div>
    <h1>قنوات <span>التلفزيون</span></h1>
    <p class="hero-sub">بث مباشر لقنوات عربية وعالمية — مصدر البيانات قوائم IPTV المفتوحة من مشروع iptv-org على GitHub</p>
    <div class="hero-stats">
      <div class="stat"><b id="statChannels">—</b><span>قناة متاحة</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><b id="statSource">GitHub</b><span>iptv-org</span></div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="أدوات البحث والتصفية">
      <div class="source-tabs" role="tablist" aria-label="فئة القنوات">
        <button type="button" class="src-tab active" data-source="arabic" role="tab" aria-selected="true">🌍 عربية</button>
        <button type="button" class="src-tab" data-source="world" role="tab" aria-selected="false">🌐 عالمية</button>
        <button type="button" class="src-tab" data-source="fav" role="tab" aria-selected="false">♥ المفضلة <span id="favCount" class="badge">0</span></button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="ابحث عن قناة…" autocomplete="off" />
        <button type="button" id="searchClear" class="icon-btn small hidden" aria-label="مسح البحث">✕</button>
      </div>
      <div class="chip-row" id="catChips" role="group" aria-label="الفئات"></div>
    </section>

    <p class="result-count" id="resultCount" role="status"></p>

    <section class="grid tv-grid" id="grid" aria-label="قائمة القنوات"></section>

    <div class="empty" id="empty" hidden>
      <div class="empty-icon">📺</div>
      <h2 id="emptyTitle">لا توجد نتائج مطابقة</h2>
      <p id="emptyMsg">جرّب كلمة بحث أخرى أو أعد ضبط الفلاتر</p>
      <button type="button" id="retryBtn" class="hidden">إعادة المحاولة</button>
    </div>

    <div class="load-more-wrap"><button type="button" id="loadMore" class="load-more hidden">عرض المزيد ⬇</button></div>
  </main>

  <footer class="footer">
    <p>📺 القنوات مجمَّعة من <a href="https://github.com/iptv-org/iptv" target="_blank" rel="noopener noreferrer">iptv-org/iptv</a> — بعض القنوات قد لا تعمل حسب المنطقة</p>
  </footer>

  <div class="theater" id="theater" role="dialog" aria-modal="true" aria-label="مشغل القنوات" hidden>
    <div class="theater-box">
      <div class="video-wrap">
        <video id="video" playsinline controls></video>
        <div class="video-status" id="videoStatus"></div>
      </div>
      <div class="theater-meta">
        <div class="theater-info">
          <strong id="tvName"></strong>
          <span id="tvGroup"></span>
        </div>
        <div class="theater-actions">
          <button type="button" class="pc-btn heart" id="tvFav" title="المفضلة" aria-label="إضافة للمفضلة">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.11C.8 10.2 1.7 6.9 4.5 5.7c1.9-.8 4-.3 5.5 1.2L12 8.9l2-2c1.5-1.5 3.6-2 5.5-1.2 2.8 1.2 3.7 4.5 1.83 7.19C18.7 16.65 12 21 12 21z"/></svg>
          </button>
          <button type="button" class="pc-btn" id="btnFullscreen" title="ملء الشاشة" aria-label="ملء الشاشة">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button type="button" class="pc-btn close" id="btnCloseTheater" title="إغلاق" aria-label="إغلاق المشغل">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="js/hls.min.js"></script>
  <script src="js/tv.js"></script>
</body>
</html>
